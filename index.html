<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <title>Frontend Mentor | Intro component with sign up form</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="main-page">
    <section class="hero">
      <h1 class="hero-title white-text font-semibold">Learn to code by watching others</h1>

      <p class="hero-description white-text">See how experienced developers solve problems in real-time. Watching scripted tutorials is great, 
      but understanding how developers think is invaluable.</p> 
    </section>
    
    <section class="signup">
      <h2 class="signup-offer white-text">
        <span class="font-bold">Try it free 7 days</span> then $20/mo. thereafter
      </h2>
    
      <form class="signup-form" aria-label="Sign up form" novalidate>
        <div class="form-field">
          <label for="first-name" class="sr-only">First Name</label>
          <input 
            id="first-name" 
            class="signup-input font-semibold" 
            type="text" 
            name="first-name" 
            placeholder="First Name" 
            aria-required="true"
            aria-describedby="first-name-error">
          <span id="first-name-error" class="empty-signup-notification" role="alert" aria-live="polite"></span>
        </div>
        
        <div class="form-field">
          <label for="last-name" class="sr-only">Last Name</label>
          <input 
            id="last-name" 
            class="signup-input font-semibold" 
            type="text" 
            name="last-name" 
            placeholder="Last Name" 
            aria-required="true"
            aria-describedby="last-name-error">
          <span id="last-name-error" class="empty-signup-notification" role="alert" aria-live="polite"></span>
        </div>
        
        <div class="form-field">
          <label for="email-address" class="sr-only">Email Address</label>
          <input 
            id="email-address" 
            class="signup-input font-semibold" 
            type="email" 
            name="email-address" 
            placeholder="Email Address" 
            aria-required="true"
            aria-describedby="email-address-error">
          <span id="email-address-error" class="empty-signup-notification" role="alert" aria-live="polite"></span>
        </div>
        
        <div class="form-field">
          <label for="password" class="sr-only">Password</label>
          <input 
            id="password" 
            class="signup-input font-semibold" 
            type="password" 
            name="password" 
            placeholder="Password"
            aria-required="true"
            aria-describedby="password-error">
          <span id="password-error" class="empty-signup-notification" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="signup-button font-medium">Claim your free trial</button>

        <p class="signup-terms">
          By clicking the button, you are agreeing to our <span class="terms-red-color">Terms and Services</span>
        </p>
      </form>
    </section>
  </main>

  <script src="./index.js" charset="UTF-8"></script>
</body>
</html>
